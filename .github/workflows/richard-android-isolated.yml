name: Build and test Richard isolated APK
on:
  push:
    branches: [richard-android-test-20261009]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  richard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unpack isolated Richard code
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          tar -xzf ci/richard-src.tar.gz -C "$RUNNER_TEMP/source"
      - name: Compile and unit test
        run: |
          cd "$RUNNER_TEMP/source/richard-companion"
          bash scripts/test-core.sh
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Publish debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: richard-android-debug
          path: ${{ runner.temp }}/source/richard-companion/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
