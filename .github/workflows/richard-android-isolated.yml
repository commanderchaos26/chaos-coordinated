name: Build and test Richard isolated APK
on:
  push:
    branches: [richard-android-test-20261009]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  richard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || (yes | sdkmanager "platforms;android-35")
          test -d "$ANDROID_HOME/build-tools/35.0.0" || (yes | sdkmanager "build-tools;35.0.0")
      - name: Unpack isolated Richard code
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          tar -xzf ci/richard-src.tar.gz -C "$RUNNER_TEMP/source"
      - name: Compile and unit test
        run: |
          cd "$RUNNER_TEMP/source/richard-companion"
          mkdir -p "$RUNNER_TEMP/core-tests"
          javac -d "$RUNNER_TEMP/core-tests" app/src/main/java/com/chaos/richard/core/*.java scripts/PolicySelfTest.java
          java -cp "$RUNNER_TEMP/core-tests" PolicySelfTest
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Publish debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: richard-android-debug
          path: ${{ runner.temp }}/source/richard-companion/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  android15-smoke:
    needs: richard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: richard-android-debug
          path: /tmp/richard-apk
      - name: Emulator install and launch smoke test (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -eu
            adb install -r /tmp/richard-apk/app-debug.apk
            adb shell am start -W -n com.chaos.richard/.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep -q 'com.chaos.richard'
            adb shell uiautomator dump /sdcard/richard-ui.xml
            adb shell cat /sdcard/richard-ui.xml | grep -q 'RICHARD'
            adb shell pm path com.chaos.richard
            echo 'PASS: Richard installed, launched, and rendered on Android API 35'
