name: Android Preview Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'android/**'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-preview.yml'

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://twmjnbktebpaqwlsrgiy.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_kpa03UQVJ2ZQTWlJAdafmQ_VdLKF1WR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build standalone Android preview APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Android preview APK
        uses: actions/upload-artifact@v4
        with:
          name: chaos-coordinated-android-preview
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
